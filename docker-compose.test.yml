# Test overlay: swaps real AI for a local fake provider so tests are repeatable and need no keys.
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up --build -d
services:
  mock-ai:
    image: python:3.12-slim
    working_dir: /mock
    volumes:
      - ./tests/e2e:/mock:ro
    command: sh -c "pip install -q fastapi==0.115.6 uvicorn==0.32.1 python-multipart==0.0.20 && uvicorn mock_provider:app --host 0.0.0.0 --port 8099"
  ai:
    environment:
      GROQ_API_KEY: test
      GROQ_BASE_URL: http://mock-ai:8099/v1
      GEMINI_API_KEY: ""
      GOOGLE_API_KEY: ""
    depends_on:
      - mock-ai
